name: Build Fiserve MSI

on:

  push:
    branches:
      - backup-msi-without-installers

  workflow_dispatch:


jobs:

  build-msi:

    name: Build Application + MSI

    runs-on: windows-2025

    permissions:
      contents: read

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup .NET 10
      # ==========================================================

      - name: Setup .NET 10

        uses: actions/setup-dotnet@v4

        with:
          dotnet-version: 10.0.x


      # ==========================================================
      # 3. Setup MSBuild
      # ==========================================================

      - name: Setup MSBuild

        uses: microsoft/setup-msbuild@v2


      # ==========================================================
      # 4. Restore NuGet packages
      # ==========================================================

      - name: Restore NuGet packages

        shell: pwsh

        run: |

          Write-Host "Restoring NuGet packages..."

          nuget restore FiserveDotnetFrameworkTest.csproj

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed."
          }


      # ==========================================================
      # 5. Build the .NET Framework application
      # ==========================================================

      - name: Build application

        shell: pwsh

        run: |

          Write-Host "Building FiserveDotnetFrameworkTest..."

          msbuild FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU"

          if ($LASTEXITCODE -ne 0) {
              throw "Application build failed."
          }


      # ==========================================================
      # 6. Publish ASP.NET application
      # ==========================================================

      - name: Publish application

        shell: pwsh

        run: |

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"


          Write-Host "Publish directory:"
          Write-Host $publishDirectory


          # ------------------------------------------------------
          # Remove old publish directory
          # ------------------------------------------------------

          if (Test-Path $publishDirectory) {

              Remove-Item `
                $publishDirectory `
                -Recurse `
                -Force
          }


          # ------------------------------------------------------
          # Create publish directory
          # ------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Path $publishDirectory `
            -Force | Out-Null


          # ------------------------------------------------------
          # Publish application
          # ------------------------------------------------------

          msbuild FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishDirectory"


          if ($LASTEXITCODE -ne 0) {
              throw "Application publish failed."
          }


          # ------------------------------------------------------
          # Verify published files
          # ------------------------------------------------------

          $publishedFiles = Get-ChildItem `
            $publishDirectory `
            -Recurse `
            -File


          Write-Host ""
          Write-Host "Published file count:"
          Write-Host $publishedFiles.Count


          if ($publishedFiles.Count -eq 0) {

              throw `
                "Publish completed but no files were found in $publishDirectory"
          }


          Write-Host ""
          Write-Host "Published application files:"

          Get-ChildItem `
            $publishDirectory `
            -Recurse


      # ==========================================================
      # 7. Verify makecab.exe
      # ==========================================================

      - name: Locate makecab

        shell: pwsh

        run: |

          $makecab = Join-Path `
            $env:WINDIR `
            "System32\makecab.exe"


          if (!(Test-Path $makecab)) {

              throw `
                "makecab.exe was not found at $makecab"
          }


          Write-Host ""
          Write-Host "makecab.exe found:"
          Write-Host $makecab


          & $makecab /?


      # ==========================================================
      # 8. Create MSI output directory
      # ==========================================================

      - name: Create MSI output directory

        shell: pwsh

        run: |

          $artifactDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"


          if (Test-Path $artifactDirectory) {

              Remove-Item `
                $artifactDirectory `
                -Recurse `
                -Force
          }


          New-Item `
            -ItemType Directory `
            -Path $artifactDirectory `
            -Force | Out-Null


          Write-Host ""
          Write-Host "MSI output directory:"
          Write-Host $artifactDirectory


      # ==========================================================
      # 9. Build MSI Builder
      # ==========================================================

      - name: Build MSI Builder

        shell: pwsh

        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Building MSI Builder"
          Write-Host "=========================================="


          dotnet build `
            Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release


          if ($LASTEXITCODE -ne 0) {

              throw `
                "MSI Builder compilation failed."
          }


      # ==========================================================
      # 10. Build MSI
      # ==========================================================

      - name: Build MSI

        shell: pwsh

        run: |

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"


          $msiDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"


          $msiPath = Join-Path `
            $msiDirectory `
            "FiserveApplication.msi"


          # ------------------------------------------------------
          # MSI version
          #
          # Example:
          #
          # GitHub run 25
          #     ↓
          # 1.0.25
          # ------------------------------------------------------

          $version = "1.0.${{ github.run_number }}"


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Building MSI"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Source directory:"
          Write-Host $publishDirectory


          Write-Host ""
          Write-Host "MSI output:"
          Write-Host $msiPath


          Write-Host ""
          Write-Host "MSI version:"
          Write-Host $version


          # ------------------------------------------------------
          # Verify publish directory
          # ------------------------------------------------------

          if (!(Test-Path $publishDirectory)) {

              throw `
                "Publish directory does not exist: $publishDirectory"
          }


          $publishedFiles = Get-ChildItem `
            $publishDirectory `
            -Recurse `
            -File


          if ($publishedFiles.Count -eq 0) {

              throw `
                "No published application files were found."
          }


          Write-Host ""
          Write-Host "Files going into MSI:"
          Write-Host $publishedFiles.Count


          # ------------------------------------------------------
          # Run MSI Builder
          # ------------------------------------------------------

          dotnet run `
            --project Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release `
            -- `
            "$publishDirectory" `
            "$msiPath" `
            "$version"


          if ($LASTEXITCODE -ne 0) {

              throw `
                "MSI Builder failed."
          }


          # ------------------------------------------------------
          # Verify MSI
          # ------------------------------------------------------

          if (!(Test-Path $msiPath)) {

              throw `
                "MSI file was not created: $msiPath"
          }


          $msiFile = Get-Item $msiPath


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " MSI CREATED SUCCESSFULLY"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "MSI path:"
          Write-Host $msiFile.FullName


          Write-Host ""
          Write-Host "MSI size:"
          Write-Host "$($msiFile.Length) bytes"


      # ==========================================================
      # 11. Show MSI information
      # ==========================================================

      - name: Show MSI information

        shell: pwsh

        run: |

          $msiPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts\FiserveApplication.msi"


          if (!(Test-Path $msiPath)) {

              throw `
                "MSI file does not exist: $msiPath"
          }


          $file = Get-Item $msiPath


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " MSI INFORMATION"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "MSI path:"
          Write-Host $file.FullName


          Write-Host ""
          Write-Host "MSI size:"
          Write-Host "$($file.Length) bytes"


      # ==========================================================
      # 12. Upload MSI to GitHub Actions Artifact
      # ==========================================================

      - name: Upload MSI artifact

        uses: actions/upload-artifact@v4

        with:

          name: FiserveApplication-MSI

          path: artifacts/FiserveApplication.msi

          if-no-files-found: error

          retention-days: 7
