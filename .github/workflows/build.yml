name: Build MSI - C# Windows Installer API

on:
  push:
    branches:
      - backup-msi-without-installers

  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2022

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Display installed .NET versions
      - name: Verify .NET installation
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-runtimes

      # 4. Restore MSI Builder
      - name: Restore MSI Builder
        run: |
          dotnet restore Installer/MsiBuilder/MsiBuilder.csproj

      # 5. Build MSI Builder
      - name: Build MSI Builder
        run: |
          dotnet build Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release `
            --no-restore

      # 6. Run MSI Builder
      - name: Generate MSI
        run: |
          dotnet run `
            --project Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release `
            --no-build

      # 7. Verify generated MSI
      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "MsiBuilderTest.msi"

          if (-not (Test-Path $msi)) {
            Write-Error "MSI was not generated: $msi"
            exit 1
          }

          $file = Get-Item $msi

          Write-Host "MSI generated successfully."
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      # 8. Upload MSI as GitHub Actions artifact
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiserv-MSI
          path: '${{ runner.temp }}/MsiBuilderTest.msi'
          if-no-files-found: error
