name: Build Fiserv MSI

on:

  push:
    branches:
      - backup-msi-without-installers

  workflow_dispatch:

jobs:

  build-msi:

    name: Build Application + MSI

    runs-on: windows-2025

    permissions:
      contents: read

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup .NET
      # ==========================================================

      - name: Setup .NET 8

        uses: actions/setup-dotnet@v4

        with:
          dotnet-version: 8.0.x


      # ==========================================================
      # 3. Setup MSBuild
      # ==========================================================

      - name: Setup MSBuild

        uses: microsoft/setup-msbuild@v2


      # ==========================================================
      # 4. Restore NuGet packages
      # ==========================================================

      - name: Restore NuGet packages

        shell: pwsh

        run: |

          nuget restore FiservDotnetFrameworkTest.csproj
          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed."
          }


      # ==========================================================
      # 5. Build the application
      # ==========================================================

      - name: Build application

        shell: pwsh

        run: |

          msbuild FiservDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="Any CPU"
            if ($LASTEXITCODE -ne 0) {
                throw "Application build failed."
            }


      # ==========================================================
      # 6. Publish ASP.NET application
      # ==========================================================

      - name: Publish application

        shell: pwsh

        run: |

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishDirectory) {
              Remove-Item `
                $publishDirectory `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishDirectory `
            -Force | Out-Null

          msbuild FiservDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishDirectory"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Published application"
          Write-Host "=========================================="

          Get-ChildItem `
            $publishDirectory `
            -Recurse


      # ==========================================================
      # 7. Display makecab
      # ==========================================================

      - name: Locate makecab

        shell: pwsh

        run: |

          $makecab = Join-Path `
            $env:WINDIR `
            "System32\makecab.exe"

          if (!(Test-Path $makecab)) {
              throw "makecab.exe was not found at $makecab"
          }

          Write-Host "makecab: $makecab"

          & $makecab /?


      # ==========================================================
      # 8. Create MSI output directory
      # ==========================================================

      - name: Create MSI output directory

        shell: pwsh

        run: |

          $artifactDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"

          if (Test-Path $artifactDirectory) {
              Remove-Item `
                $artifactDirectory `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactDirectory `
            -Force | Out-Null


      # ==========================================================
      # 9. Build MSI Builder
      # ==========================================================

      - name: Build MSI Builder

        shell: pwsh

        run: |

          dotnet build `
            Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release


      # ==========================================================
      # 10. Build MSI
      # ==========================================================

      - name: Build MSI

        shell: pwsh

        run: |

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          $msiDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"

          $msiPath = Join-Path `
            $msiDirectory `
            "FiservApplication.msi"

          # MSI supports major.minor.build.
          #
          # github.run_number gives us an automatically
          # increasing build number.
          $version = "1.0.${{ github.run_number }}"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Building MSI"
          Write-Host "=========================================="

          Write-Host "Source : $publishDirectory"
          Write-Host "Output : $msiPath"
          Write-Host "Version: $version"

          dotnet run `
            --project Installer/MsiBuilder/MsiBuilder.csproj `
            --configuration Release `
            -- `
            "$publishDirectory" `
            "$msiPath" `
            "$version"

          if ($LASTEXITCODE -ne 0) {
              throw "MSI Builder failed."
          }

          if (!(Test-Path $msiPath)) {
              throw "MSI file was not created: $msiPath"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " MSI CREATED"
          Write-Host "=========================================="

          Get-Item $msiPath


      # ==========================================================
      # 11. MSI file information
      # ==========================================================

      - name: Show MSI information

        shell: pwsh

        run: |

          $msiPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts\FiservApplication.msi"

          $file = Get-Item $msiPath

          Write-Host ""
          Write-Host "MSI path:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "MSI size:"
          Write-Host "$($file.Length) bytes"


      # ==========================================================
      # 12. Upload MSI as GitHub Actions artifact
      # ==========================================================

      - name: Upload MSI artifact

        uses: actions/upload-artifact@v4

        with:

          name: FiservApplication-MSI

          path: artifacts/FiservApplication.msi

          if-no-files-found: error

          retention-days: 7
