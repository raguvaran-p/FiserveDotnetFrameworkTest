name: Build ASP.NET Framework Application

on:
  push:
    branches:
      - backup-msi-without-installers
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-2022

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

            - name: Verify Windows Installer Components
        shell: pwsh
        run: |
          Write-Host "===== WINDOWS VERSION ====="
          cmd /c ver

          Write-Host ""
          Write-Host "===== WINDOWS INSTALLER DLL ====="
          if (Test-Path "$env:WINDIR\System32\msi.dll") {
              Write-Host "msi.dll FOUND"
              Get-Item "$env:WINDIR\System32\msi.dll" |
                Select-Object FullName, Length
          }
          else {
              Write-Error "msi.dll NOT FOUND"
              exit 1
          }

          Write-Host ""
          Write-Host "===== MAKECAB ====="
          if (Test-Path "$env:WINDIR\System32\makecab.exe") {
              Write-Host "makecab.exe FOUND"
              Get-Item "$env:WINDIR\System32\makecab.exe" |
                Select-Object FullName, Length
          }
          else {
              Write-Error "makecab.exe NOT FOUND"
              exit 1
          }

          Write-Host ""
          Write-Host "===== DOTNET ====="
          dotnet --version

          Write-Host ""
          Write-Host "===== VERIFICATION COMPLETE ====="
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
 
      - name: Restore NuGet Packages
        run: |
          nuget restore FiserveDotnetFrameworkTest.slnx -PackagesDirectory packages

      - name: Build Solution
        run: |
          msbuild FiserveDotnetFrameworkTest.slnx /p:Configuration=Release

      - name: Publish ASP.NET Application
        run: |
          msbuild FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:PublishUrl="${{ github.workspace }}\publish"

      - name: Verify Publish Output
        run: |
          Write-Host "===== PUBLISH DIRECTORY ====="
          Get-ChildItem "${{ github.workspace }}\publish" -Recurse

      
           
     

          
