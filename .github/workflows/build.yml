name: Build and Package Fiserve Application

on:
  push:
    branches:
      - dotnet-framework-4.8-zip-azure-harness

  workflow_dispatch:
  
permissions:
  contents: read
  
jobs:
  build-publish:
    name: Build, Publish and Upload ZIP
    runs-on: windows-2022

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
      # ==========================================================
      # Azure login
      # ==========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
    
      # ==========================================================
      # 2. Setup .NET
      # ==========================================================

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      # ==========================================================
      # 3. Setup MSBuild
      # ==========================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ==========================================================
      # 4. Restore NuGet packages
      # ==========================================================

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $packagesDirectory = Join-Path $env:GITHUB_WORKSPACE "packages"

          New-Item `
            -ItemType Directory `
            -Path $packagesDirectory `
            -Force | Out-Null

          nuget restore FiserveDotnetFrameworkTest.csproj `
            -PackagesDirectory "$packagesDirectory"

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }


      # ==========================================================
      # 5. Build
      # ==========================================================

      - name: Build application
        shell: pwsh
        run: |
          msbuild FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU"

          if ($LASTEXITCODE -ne 0) {
            throw "Application build failed."
          }


      # ==========================================================
      # 6. Publish
      # ==========================================================

      - name: Publish application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishDirectory) {
            Remove-Item `
              $publishDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishDirectory `
            -Force | Out-Null

          msbuild FiserveDotnetFrameworkTest.csproj `
            /t:WebPublish `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:WebPublishMethod=FileSystem `
            /p:publishUrl="$publishDirectory" `
            /p:DeleteExistingFiles=true

          if ($LASTEXITCODE -ne 0) {
            throw "Application publish failed."
          }


      # ==========================================================
      # 7. Create ZIP from published output
      # ==========================================================

      - name: Create ZIP
        shell: pwsh
        run: |
          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          $zipPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "FiserveApplication.zip"

          Compress-Archive `
            -Path "$publishDirectory\*" `
            -DestinationPath $zipPath `
            -Force

          if (!(Test-Path $zipPath)) {
            throw "ZIP file was not created."
          }


      # ==========================================================
      # 8. Upload ZIP artifact
      # ==========================================================

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiserveApplication
          path: FiserveApplication.zip
          if-no-files-found: error

      # ==========================================================
      # 9. Upload ZIP to Azure Blob Storage
      # ==========================================================

      - name: Upload ZIP to Azure Storage
        shell: pwsh
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          az storage blob upload `
            --account-name "fiservstacc1" `
            --account-key "$env:AZURE_STORAGE_ACCOUNT_KEY" `
            --container-name "harnesscontainer" `
            --name "FiserveApplication.zip" `
            --file "$env:GITHUB_WORKSPACE\FiserveApplication.zip" `
            --auth-mode key `
            --overwrite true

      # ==========================================================
      # 10. Trigger Harness CD
      # ==========================================================

      - name: Trigger Harness CD
        if: success()
        shell: pwsh
        env:
          HARNESS_WEBHOOK_URL: ${{ secrets.HARNESS_WEBHOOK_URL }}
        run: |
          $body = @{
            sample_key = "sample_value"
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Method POST `
            -Uri $env:HARNESS_WEBHOOK_URL `
            -ContentType "application/json" `
            -Body $body

          echo "Harness Response:"
          echo "Harness CD triggered successfully."
          
          
        
