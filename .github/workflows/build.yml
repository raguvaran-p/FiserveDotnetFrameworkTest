

name: Build and Push Docker Image (.NET Framework 4.8)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    permissions:
      contents: read

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup MSBuild
      # ==========================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ==========================================================
      # 3. Setup NuGet
      # ==========================================================

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ==========================================================
      # 4. Restore NuGet packages
      # ==========================================================

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Restoring NuGet packages"
          Write-Host "=========================================="

          nuget restore `
            FiserveDotnetFrameworkTest.slnx `
            -PackagesDirectory packages

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }

          Write-Host "NuGet restore completed successfully."


      # ==========================================================
      # 5. Build .NET Framework 4.8 application
      # ==========================================================

      - name: Build .NET Framework 4.8 application
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Building .NET Framework 4.8 application"
          Write-Host "=========================================="

          msbuild `
            FiserveDotnetFrameworkTest.slnx `
            /p:Configuration=Release `
            /p:Platform="AnyCPU"

          if ($LASTEXITCODE -ne 0) {
            throw "Application build failed."
          }

          Write-Host "Application build completed successfully."


      # ==========================================================
      # 6. Publish ASP.NET Framework application
      # ==========================================================

      - name: Publish ASP.NET Framework application
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Publishing application"
          Write-Host "=========================================="

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishDirectory) {
            Remove-Item `
              $publishDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishDirectory `
            -Force | Out-Null

          msbuild `
            FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:PublishUrl="$publishDirectory"

          if ($LASTEXITCODE -ne 0) {
            throw "Application publish failed."
          }

          Write-Host "Publish completed successfully."

          Write-Host "Published files:"
          Get-ChildItem $publishDirectory -Recurse


      # ==========================================================
      # 7. Run tests - optional
      # ==========================================================

      # Enable this only if your repository has .NET Framework
      # test projects compatible with the runner.
      #
      # - name: Run tests
      #   shell: pwsh
      #   run: |
      #     vstest.console.exe "path\to\test.dll"


      # ==========================================================
      # 8. Log in to Docker registry
      # ==========================================================

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERPWD }}


      # ==========================================================
      # 9. Build Docker image
      # ==========================================================

      - name: Build Docker image
        shell: pwsh
        run: |
          $IMAGE_NAME = "my-dotnet-framework-app"
          $IMAGE_TAG = "TestImage"

          Write-Host "=========================================="
          Write-Host " Building Docker image"
          Write-Host "=========================================="

          docker build `
            -t "${IMAGE_NAME}:${IMAGE_TAG}" `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          Write-Host "Docker image built successfully."


      # ==========================================================
      # 10. Tag Docker image
      # ==========================================================

      - name: Tag Docker image
        shell: pwsh
        run: |
          $IMAGE_NAME = "my-dotnet-framework-app"
          $IMAGE_TAG = "TestImage"

          docker tag `
            "${IMAGE_NAME}:${IMAGE_TAG}" `
            "${{ secrets.DOCKERUSER }}/${IMAGE_NAME}:${IMAGE_TAG}"


      # ==========================================================
      # 11. Push Docker image
      # ==========================================================

      - name: Push Docker image
        shell: pwsh
        run: |
          $IMAGE_NAME = "my-dotnet-framework-app"
          $IMAGE_TAG = "TestImage"

          Write-Host "=========================================="
          Write-Host " Pushing Docker image"
          Write-Host "=========================================="

          docker push `
            "${{ secrets.DOCKERUSER }}/${IMAGE_NAME}:${IMAGE_TAG}"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          Write-Host "Docker image pushed successfully."
