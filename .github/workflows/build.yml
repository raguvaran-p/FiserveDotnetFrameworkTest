name: Build and Publish Fiserve Application

on:
  push:
    branches:
      - clean-build-publish

  workflow_dispatch:

jobs:
  build-publish:
    name: Build and Publish Application
    runs-on: windows-2022

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup .NET
      # ==========================================================

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      # ==========================================================
      # 3. Setup MSBuild
      # ==========================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ==========================================================
      # 4. Restore NuGet packages
      # ==========================================================

      - name: Restore NuGet packages
        shell: pwsh
        run: |

          $packagesDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "packages"

          New-Item `
            -ItemType Directory `
            -Path $packagesDirectory `
            -Force | Out-Null

          nuget restore FiserveDotnetFrameworkTest.csproj `
            -PackagesDirectory "$packagesDirectory"

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }


      # ==========================================================
      # 5. Build application
      # ==========================================================

      - name: Build application
        shell: pwsh
        run: |

          msbuild FiserveDotnetFrameworkTest.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU"

          if ($LASTEXITCODE -ne 0) {
            throw "Application build failed."
          }


      # ==========================================================
      # 6. Publish application
      # ==========================================================

      - name: Publish application
        shell: pwsh
        run: |

          $publishDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishDirectory) {
            Remove-Item `
              $publishDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishDirectory `
            -Force | Out-Null

          msbuild FiserveDotnetFrameworkTest.csproj `
            /t:WebPublish `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:WebPublishMethod=FileSystem `
            /p:publishUrl="$publishDirectory" `
            /p:DeleteExistingFiles=true

          if ($LASTEXITCODE -ne 0) {
            throw "Application publish failed."
          }
